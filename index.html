<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trắc Nghiệm Hồi Sức Cấp Cứu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header cố định trên mobile -->
    <header class="sticky top-0 z-20 bg-indigo-700 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg leading-tight">Trắc Nghiệm Y Khoa</h1>
                <p class="text-xs text-indigo-200" id="topic-title">Hồi Sức Cấp Cứu - 72 Câu</p>
            </div>
            <button id="btn-grid" onclick="toggleGridModal()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5 border border-indigo-500">
                <i class="fa-solid fa-th"></i>
                <span id="progress-text">1/72</span>
            </button>
        </div>
    </header>

    <!-- Nội dung câu hỏi -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- Thẻ chứa thông tin Ca lâm sàng / Chủ đề -->
        <div id="case-box" class="hidden mb-3 bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-lg shadow-sm text-sm text-amber-900">
            <div class="font-semibold text-xs text-amber-700 uppercase tracking-wide mb-1" id="case-title">Ca Lâm Sàng</div>
            <div id="case-content" class="leading-relaxed"></div>
        </div>

        <!-- Thẻ câu hỏi -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2.5 py-1 rounded-full" id="question-number">Câu 1</span>
            </div>
            <h2 class="text-base font-semibold text-slate-900 leading-snug mb-4" id="question-text">
                Nội dung câu hỏi...
            </h2>

            <!-- Thông báo chọn sai -->
            <div id="wrong-msg" class="hidden mb-3 p-2.5 bg-rose-100 border border-rose-300 text-rose-800 rounded-xl text-xs font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-xmark text-rose-600 text-base"></i>
                <span>Bạn chọn chưa chính xác! Vui lòng chọn lại.</span>
            </div>

            <!-- Danh sách lựa chọn -->
            <div class="space-y-2.5" id="options-container">
                <!-- JS sẽ render các đáp án A, B, C, D -->
            </div>
        </div>

        <!-- Thẻ giải thích (chỉ hiển thị khi đã chọn ĐÚNG) -->
        <div id="explanation-box" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 text-sm text-emerald-900 shadow-sm">
            <div class="font-bold text-emerald-700 flex items-center gap-1.5 mb-1">
                <i class="fa-solid fa-circle-check"></i> Chính xác! Giải thích chi tiết:
            </div>
            <div id="explanation-text" class="leading-relaxed text-slate-700"></div>
        </div>
    </main>

    <!-- Navigation Bar cố định ở đáy màn hình -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 bg-white border-t border-slate-200 shadow-lg">
        <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-3">
            <button id="btn-prev" onclick="prevQuestion()" class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-arrow-left"></i> Câu trước
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95 shadow-md shadow-indigo-200">
                Câu tiếp <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <!-- Modal chọn câu hỏi nhanh (Grid Modal) -->
    <div id="grid-modal" class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Danh sách câu hỏi</h3>
                <button onclick="toggleGridModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto grid grid-cols-6 gap-2" id="grid-container">
                <!-- Render danh sách câu 1 - 72 -->
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex justify-around text-xs text-slate-600">
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-200 inline-block"></span> Chưa làm</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-400 inline-block"></span> Làm sai (Thử lại)</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Đã hoàn thành</div>
            </div>
        </div>
    </div>

    <!-- Script dữ liệu & Xử lý logic -->

            {

                caseText: "Cấp cứu COPD[cite: 1].",
                question: "Bệnh nhân COPD khó thở nhập viện. Chọn oxy như thế nào?",

                answer: 0, // A
                explanation: "Bệnh nhân COPD chỉ nên cho thở oxy liều thấp (1-2 lít/phút) để tránh làm mất trung khu hô hấp do tăng CO2 mạn tính[cite: 1]."

        let currentIndex = 0;
        
        // Mảng lưu vết:
        // isCorrect: null (chưa làm), true (đã trả lời đúng), false (đã thử và sai)
        // wrongChoices: Mảng chứa các đáp án chọn sai của câu hiện tại
        let userState = quizData.map(() => ({
            isCorrect: false,
            wrongChoices: []
        }));

        document.addEventListener("DOMContentLoaded", () => {
            renderQuestion();
            renderGridModal();
        });

        function renderQuestion() {
            const q = quizData[currentIndex];
            const state = userState[currentIndex];
            
            // Cập nhật Header
            document.getElementById('progress-text').innerText = `${currentIndex + 1}/${quizData.length}`;
            document.getElementById('question-number').innerText = `Câu ${currentIndex + 1} / ${quizData.length}`;
            
            // Render Ca lâm sàng
            const caseBox = document.getElementById('case-box');
            if (q.caseTitle && q.caseText) {
                document.getElementById('case-title').innerText = q.caseTitle;
                document.getElementById('case-content').innerText = q.caseText;
                caseBox.classList.remove('hidden');
            } else {
                caseBox.classList.add('hidden');
            }

            // Nội dung câu hỏi
            document.getElementById('question-text').innerText = q.question;

            // Render Danh sách lựa chọn
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border flex items-center justify-between gap-3 text-sm transition active:scale-[0.99] `;
                
                const isWrongChoice = state.wrongChoices.includes(i);
                const isCorrectChoice = state.isCorrect && (i === q.answer);

                if (isCorrectChoice) {
                    // Đúng -> Nổi bật màu xanh lá
                    btn.className += `border-emerald-500 bg-emerald-50 text-emerald-900 font-medium cursor-default`;
                } else if (isWrongChoice) {
                    // Chọn sai -> Viền đỏ nhạt, báo sai
                    btn.className += `border-rose-300 bg-rose-50 text-rose-800 opacity-80`;
                } else if (state.isCorrect) {
                    // Đã làm đúng câu này rồi thì ẩn mờ các câu khác
                    btn.className += `border-slate-200 bg-white text-slate-400 opacity-50 cursor-default`;
                } else {
                    // Chưa chọn hoặc chọn lại
                    btn.className += `border-slate-200 bg-white hover:bg-slate-50 text-slate-700`;
                }

                // Gán sự kiện click (chỉ bấm được nếu chưa hoàn thành câu này)
                btn.onclick = () => selectAnswer(i);

                let statusIcon = '';
                if (isCorrectChoice) {
                    statusIcon = `<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>`;
                } else if (isWrongChoice) {
                    statusIcon = `<i class="fa-solid fa-circle-xmark text-rose-500 text-lg"></i>`;
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg border flex items-center justify-center font-bold text-xs shrink-0 ${
                            isCorrectChoice ? 'bg-emerald-600 text-white border-emerald-600' :
                            isWrongChoice ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-100 border-slate-300 text-slate-600'
                        }">${letters[i]}</span>
                        <span class="leading-tight">${optText}</span>
                    </div>
                    ${statusIcon}
                `;

                optionsContainer.appendChild(btn);
            });

            // Hiển thị Banner Báo Sai khi có lựa chọn sai gần nhất
            const wrongMsg = document.getElementById('wrong-msg');
            if (state.wrongChoices.length > 0 && !state.isCorrect) {
                wrongMsg.classList.remove('hidden');
            } else {
                wrongMsg.classList.add('hidden');
            }

            // Hiển thị Giải thích CHỈ KHI ĐÃ CHỌN ĐÚNG
            const expBox = document.getElementById('explanation-box');
            if (state.isCorrect) {
                document.getElementById('explanation-text').innerText = q.explanation || "Không có giải thích chi tiết.";
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Cập nhật nút Chuyển câu
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-prev').style.opacity = currentIndex === 0 ? '0.5' : '1';
            
            const btnNext = document.getElementById('btn-next');
            if (currentIndex === quizData.length - 1) {
                btnNext.innerHTML = `Hoàn thành <i class="fa-solid fa-check"></i>`;
            } else {
                btnNext.innerHTML = `Câu tiếp <i class="fa-solid fa-arrow-right"></i>`;
            }
        }

        function selectAnswer(optionIndex) {
            const state = userState[currentIndex];
            const q = quizData[currentIndex];

            // Nếu câu hỏi đã trả lời đúng rồi thì không xử lý nữa
            if (state.isCorrect) return;

            if (optionIndex === q.answer) {
                // Chọn ĐÚNG -> Đánh dấu hoàn thành
                state.isCorrect = true;
            } else {
                // Chọn SAI -> Lưu vào danh sách các đáp án chọn sai nếu chưa có
                if (!state.wrongChoices.includes(optionIndex)) {
                    state.wrongChoices.push(optionIndex);
                }
            }

            renderQuestion();
            renderGridModal();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                toggleGridModal();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            toggleGridModal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleGridModal() {
            const modal = document.getElementById('grid-modal');
            modal.classList.toggle('hidden');
        }

        function renderGridModal() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `h-10 rounded-lg text-xs font-bold transition flex items-center justify-center `;

                const state = userState[idx];
                if (state.isCorrect) {
                    btn.className += `bg-emerald-500 text-white`; // Đã làm đúng
                } else if (state.wrongChoices.length > 0) {
                    btn.className += `bg-rose-400 text-white`; // Đã thử nhưng sai
                } else {
                    btn.className += `bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200`; // Chưa làm
                }

                if (idx === currentIndex) {
                    btn.className += ` ring-2 ring-indigo-600 ring-offset-2`;
                }

                btn.innerText = idx + 1;
                btn.onclick = () => jumpToQuestion(idx);
                container.appendChild(btn);
            });
        }
    </script>
</body>
</html>
