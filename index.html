<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trắc Nghiệm Hồi Sức Cấp Cứu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header cố định trên mobile -->
    <header class="sticky top-0 z-20 bg-indigo-700 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg leading-tight">Trắc Nghiệm Y Khoa</h1>
                <p class="text-xs text-indigo-200" id="topic-title">Hồi Sức Cấp Cứu - 72 Câu</p>
            </div>
            <button id="btn-grid" onclick="toggleGridModal()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5 border border-indigo-500">
                <i class="fa-solid fa-th"></i>
                <span id="progress-text">1/72</span>
            </button>
        </div>
    </header>

    <!-- Nội dung câu hỏi -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- Thẻ chứa thông tin Ca lâm sàng / Chủ đề -->
        <div id="case-box" class="hidden mb-3 bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-lg shadow-sm text-sm text-amber-900">
            <div class="font-semibold text-xs text-amber-700 uppercase tracking-wide mb-1" id="case-title">Ca Lâm Sàng</div>
            <div id="case-content" class="leading-relaxed"></div>
        </div>

        <!-- Thẻ câu hỏi -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2.5 py-1 rounded-full" id="question-number">Câu 1</span>
            </div>
            <h2 class="text-base font-semibold text-slate-900 leading-snug mb-4" id="question-text">
                Nội dung câu hỏi...
            </h2>

            <!-- Thông báo chọn sai -->
            <div id="wrong-msg" class="hidden mb-3 p-2.5 bg-rose-100 border border-rose-300 text-rose-800 rounded-xl text-xs font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-xmark text-rose-600 text-base"></i>
                <span>Bạn chọn chưa chính xác! Vui lòng chọn lại.</span>
            </div>

            <!-- Danh sách lựa chọn -->
            <div class="space-y-2.5" id="options-container">
                <!-- JS sẽ render các đáp án A, B, C, D -->
            </div>
        </div>

        <!-- Thẻ giải thích (chỉ hiển thị khi đã chọn ĐÚNG) -->
        <div id="explanation-box" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 text-sm text-emerald-900 shadow-sm">
            <div class="font-bold text-emerald-700 flex items-center gap-1.5 mb-1">
                <i class="fa-solid fa-circle-check"></i> Chính xác! Giải thích chi tiết:
            </div>
            <div id="explanation-text" class="leading-relaxed text-slate-700"></div>
        </div>
    </main>

    <!-- Navigation Bar cố định ở đáy màn hình -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 bg-white border-t border-slate-200 shadow-lg">
        <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-3">
            <button id="btn-prev" onclick="prevQuestion()" class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-arrow-left"></i> Câu trước
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95 shadow-md shadow-indigo-200">
                Câu tiếp <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <!-- Modal chọn câu hỏi nhanh (Grid Modal) -->
    <div id="grid-modal" class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Danh sách câu hỏi</h3>
                <button onclick="toggleGridModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto grid grid-cols-6 gap-2" id="grid-container">
                <!-- Render danh sách câu 1 - 72 -->
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex justify-around text-xs text-slate-600">
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-200 inline-block"></span> Chưa làm</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-400 inline-block"></span> Làm sai (Thử lại)</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Đã hoàn thành</div>
            </div>
        </div>
    </div>

    <!-- Script dữ liệu & Xử lý logic -->
    <script>
        const quizData = [
            // CA LÂM SÀNG 1
            {
                id: 1,
                caseTitle: "CA LÂM SÀNG 1",

                question: "Các việc sau đây cần làm ngay cho bệnh nhân này, TRỪ:",

            },
            {
                id: 2,
                caseTitle: "CA LÂM SÀNG 1",
                caseText: "Bệnh nhân nam, 35 tuổi, vào khoa Hồi sức vì sốt cao, tụt huyết áp, đau vùng thắt lưng. Khám: mạch 130/phút, huyết áp 80/50 mmHg, thở 24/phút, SpO2 95%, lactat máu 2,4 mmol/L.",
                question: "Biện pháp thăm dò nào sau đây có giá trị nhất trong đánh giá tình trạng thể tích tuần hoàn bệnh nhân?",
                options: ["Thăm dò huyết động bằng PICCO", "Thăm dò huyết động bằng USCOM", "Siêu âm tĩnh mạch chủ dưới", "Đo áp lực tĩnh mạch trung tâm"],
                answer: 2, // C
                explanation: "Siêu âm tĩnh mạch chủ dưới (IVC) là biện pháp không xâm lấn có giá trị cao trong đánh giá thể tích tuần hoàn[cite: 1]."
            },
            {
                id: 3,
                caseTitle: "CA LÂM SÀNG 1",

                question: "Biện pháp điều trị nào được lựa chọn trong điều trị cấp cứu?",
                options: ["Đặt ống thông JJ", "Dẫn lưu bể thận qua da", "Mổ lấy sỏi và dẫn lưu bể thận", "Chưa can thiệp ngay"],
